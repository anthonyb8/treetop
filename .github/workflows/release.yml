# Builds static Linux binaries and publishes them, with checksums, as a
# GitHub release that install.sh and `treetop update` download from. A push
# to main releases the version in Cargo.toml once, the first time it lands
# with no tag of its own, so a release is the merge of a PR that bumps it;
# pushing a v* tag by hand still releases that tag.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so two merges in a row do not both publish a
# version: the second finds the first's tag and stops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      release: ${{ steps.which.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: which
        name: Decide whether this push releases
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no [workspace.package] version in Cargo.toml"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    env:
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "treetop") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - run: rustup target add ${{ matrix.target }}

      # The web app `treetop serve` hands out is built first, so the build
      # below embeds it in the binary.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e

      # rustls's crypto (ring) compiles C, which a static musl build needs a
      # musl C compiler for.
      - name: Install a musl C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name="treetop-$TAG-linux-${{ matrix.arch }}.tar.gz"
          tar czf "$name" -C "target/${{ matrix.target }}/release" treetop
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: treetop-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Makes the tag at this commit when the push to main has none yet.
      - name: Publish the release
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
