[workspace]
members = ["crates/issues", "crates/linear"]

[workspace.package]
version = "0.1.61"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[package]
name = "treetop"
version.workspace = true
edition.workspace = true
description = "An htop-style view of a treehouse worktree pool, for returning and destroying trees"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
issues = { path = "crates/issues" }
libc = "0.2.190"
qrcode = { version = "0.14.1", default-features = false }
linear = { path = "crates/linear" }
ratatui = "0.30.2"
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
ureq = "3"
vt100 = "0.16.2"

# Line tables are enough for a panic's backtrace and cut each test binary to
# well under half, which matters with a target directory in every pool tree.
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
