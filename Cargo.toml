[workspace]
members = ["crates/issues", "crates/linear"]

[workspace.package]
version = "0.1.29"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[package]
name = "treetop"
version.workspace = true
edition.workspace = true
description = "An htop-style view of a treehouse worktree pool, for returning and destroying trees"

[dependencies]
anyhow = "1.0.104"
issues = { path = "crates/issues" }
libc = "0.2.190"
linear = { path = "crates/linear" }
ratatui = "0.30.2"
serde.workspace = true
serde_json.workspace = true
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
vt100 = "0.16.2"

[profile.release]
strip = true
